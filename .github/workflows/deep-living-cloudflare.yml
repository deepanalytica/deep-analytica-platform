name: Deep Living · Cloudflare Pages
on:
  push:
    branches: [feat/deep-living-os]
    paths:
      - 'products/deep-living-os/**'
      - '.github/workflows/deep-living-cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deep-living-cloudflare
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/deep-living-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Tests and typecheck
        run: npm run check
        env:
          VITE_SUPABASE_URL: ${{ vars.DL_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.DL_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: deep-living-cloudflare-dist
          path: products/deep-living-os/dist
          retention-days: 7
  deploy:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: deep-living-cloudflare-dist
          path: products/deep-living-os/dist
      - name: Confirm Cloudflare credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Configure Cloudflare API Token and Account ID as repository secrets."
            exit 1
          fi
      - name: Create dedicated Pages project if absent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          npx --yes wrangler@4 pages project list --json > /tmp/deep-living-projects.json
          node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync('/tmp/deep-living-projects.json','utf8')); const projects=Array.isArray(data)?data:data.result||[];const found=projects.some(p=>p.name==='deep-living-intelligence-deepanalytica');process.exit(found?0:11)" && exit 0 || code=$?
          if [ "$code" -ne 11 ]; then echo "::error::Cannot determine existing Pages projects"; exit "$code"; fi
          npx --yes wrangler@4 pages project create deep-living-intelligence-deepanalytica --production-branch=main
      - name: Publish dedicated Pages site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -o pipefail
          npx --yes wrangler@4 pages deploy products/deep-living-os/dist --project-name=deep-living-intelligence-deepanalytica --branch=main 2>&1 | tee /tmp/deep-living-deploy.log
      - name: Verify published site
        shell: bash
        run: |
          URL="https://deep-living-intelligence-deepanalytica.pages.dev"
          echo "Waiting for Cloudflare Pages to respond"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 "$URL" > /tmp/deep-living-index.html && grep -q "Deep Living OS" /tmp/deep-living-index.html; then
              echo "Verified: $URL"
              echo "## Deep Living" >> "$GITHUB_STEP_SUMMARY"
              echo "Dedicated Pages URL (HTTP verified): $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 8
          done
          echo "::error::Could not verify published site"
          exit 1
