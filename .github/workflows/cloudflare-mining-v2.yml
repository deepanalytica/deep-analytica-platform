name: Deploy Mining V2 to Cloudflare

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DMI_ACCESS_PASSWORD: ${{ secrets.DMI_ACCESS_PASSWORD }}
      DMI_SESSION_SECRET: ${{ secrets.DMI_SESSION_SECRET }}
      DMI_SESSION_TTL_SECONDS: "43200"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Cloudflare adapter
        run: npm install --no-save @opennextjs/cloudflare@latest wrangler@latest

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$DMI_ACCESS_PASSWORD" || (echo "Missing DMI_ACCESS_PASSWORD" && exit 1)
          test -n "$DMI_SESSION_SECRET" || (echo "Missing DMI_SESSION_SECRET" && exit 1)

      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build

      - name: Deploy worker
        run: npx wrangler deploy --config wrangler.jsonc
