name: Deep Living OS — CI and Pages
on:
  push:
    branches: [main, feat/deep-living-os]
    paths: ['products/deep-living-os/**', '.github/workflows/deep-living-os.yml']
  pull_request:
    paths: ['products/deep-living-os/**', '.github/workflows/deep-living-os.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deep-living-os-pages
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/deep-living-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Typecheck and build
        run: npm run build
        env:
          VITE_BASE_PATH: /deep-analytica-platform/
          VITE_SUPABASE_URL: ${{ vars.DL_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.DL_SUPABASE_ANON_KEY }}
      - name: Upload preview build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-living-os-preview
          path: products/deep-living-os/dist
          retention-days: 7
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: products/deep-living-os/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  sql_security:
    name: PostgreSQL / RLS regression tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deep_living_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deep_living_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: deep_living_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Bootstrap mock Supabase environment
        run: psql -v ON_ERROR_STOP=1 -f products/deep-living-os/tests/sql/bootstrap.sql
      - name: Apply all migrations in order
        run: |
          set -euo pipefail
          for file in \
            products/deep-living-os/supabase/migrations/20261008_init.sql \
            products/deep-living-os/supabase/migrations/20261008_hardening.sql \
            products/deep-living-os/supabase/migrations/20261008_fee_privacy.sql \
            products/deep-living-os/supabase/migrations/20261008_onboarding.sql \
            products/deep-living-os/supabase/migrations/20261008_fees_draft.sql
          do
            psql -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Tenant permissions and transactional gates
        run: psql -v ON_ERROR_STOP=1 -f products/deep-living-os/tests/sql/security.sql
