name: Deploy PRAXIOS Universe Preview

on:
  workflow_dispatch:
  push:
    branches:
      - feat/praxios-universe-webos-v1
    paths:
      - "src/app/praxios-universe/**"
      - "src/app/api/praxios-universe/**"
      - "src/app/globals.css"
      - "src/app/layout.tsx"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "open-next.config.ts"
      - "wrangler.praxios-universe.jsonc"
      - ".github/workflows/praxios-universe-preview.yml"

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Install
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Install Cloudflare adapter
        run: npm install --no-save @opennextjs/cloudflare@latest wrangler@latest

      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build

      - name: Deploy isolated preview worker
        id: deploy
        shell: bash
        run: |
          npx wrangler deploy --config wrangler.praxios-universe.jsonc 2>&1 | tee /tmp/praxios-deploy.log

      - name: Publish preview URL
        if: always()
        shell: bash
        run: |
          URL=$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/praxios-deploy.log | tail -1 || true)
          echo "### PRAXIOS Universe Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: feat/praxios-universe-webos-v1" >> "$GITHUB_STEP_SUMMARY"
          echo "Route: /praxios-universe" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${URL:-see Wrangler output}" >> "$GITHUB_STEP_SUMMARY"
