name: Validate and optionally deploy PRAXIOS Universe

on:
  workflow_dispatch:
  push:
    branches:
      - feat/praxios-universe-webos-v1
    paths:
      - "src/app/praxios-universe/**"
      - "src/app/api/praxios-universe/**"
      - "src/app/globals.css"
      - "src/app/layout.tsx"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "open-next.config.ts"
      - "wrangler.praxios-universe.jsonc"
      - ".github/workflows/praxios-universe-preview.yml"

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Detect Cloudflare credentials
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials are absent. Validation will pass; Worker deployment is skipped."
          fi

      - name: Install Cloudflare adapter
        if: steps.cloudflare.outputs.enabled == 'true'
        run: npm install --no-save @opennextjs/cloudflare@latest wrangler@latest

      - name: Build for Cloudflare Workers
        if: steps.cloudflare.outputs.enabled == 'true'
        run: npx opennextjs-cloudflare build

      - name: Deploy isolated preview worker
        if: steps.cloudflare.outputs.enabled == 'true'
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --config wrangler.praxios-universe.jsonc 2>&1 | tee /tmp/praxios-deploy.log

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "### PRAXIOS Universe" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: feat/praxios-universe-webos-v1" >> "$GITHUB_STEP_SUMMARY"
          echo "Full-stack route: /praxios-universe" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare deploy enabled: ${{ steps.cloudflare.outputs.enabled }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/praxios-deploy.log ]; then
            URL=$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/praxios-deploy.log | tail -1 || true)
            echo "Worker URL: ${URL:-see Wrangler output}" >> "$GITHUB_STEP_SUMMARY"
          fi
