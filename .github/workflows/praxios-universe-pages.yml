name: Deploy PRAXIOS Universe to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - feat/praxios-universe-webos-v1
    paths:
      - "preview/praxios-universe/**"
      - ".github/workflows/praxios-universe-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: praxios-universe-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview/praxios-universe

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
