name: Deep Living OS — isolated Cloudflare Pages
on:
  push:
    branches: [feat/deep-living-decision-intelligence, feat/deep-living-os]
    paths:
      - products/deep-living-os/**
      - .github/workflows/deep-living-cloudflare-pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deep-living-cloudflare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ github.ref_name == 'feat/deep-living-os' && vars.DL_PRODUCTION_ENABLED == 'true' && vars.DL_SUPABASE_URL || '' }}
      VITE_SUPABASE_ANON_KEY: ${{ github.ref_name == 'feat/deep-living-os' && vars.DL_PRODUCTION_ENABLED == 'true' && vars.DL_SUPABASE_ANON_KEY || '' }}
      DL_PRODUCTION_ENABLED: ${{ vars.DL_PRODUCTION_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify app and safety gates
        run: |
          set -euo pipefail
          cd products/deep-living-os
          npm install --no-audit --no-fund
          npm run check
      - name: Report Cloudflare connection state
        id: cf
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "connected=true" >> "$GITHUB_OUTPUT"
          else
            echo "connected=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare Pages not deployed: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
          fi
      - name: Validate isolated Cloudflare Pages project
        if: steps.cf.outputs.connected == 'true'
        run: |
          npx --yes wrangler@4 pages project list > /tmp/cloudflare-projects.txt
          if ! grep -Eq '(^|[^a-z0-9-])deep-living-os([^a-z0-9-]|$)' /tmp/cloudflare-projects.txt; then
            echo "Cloudflare Pages project deep-living-os is missing. Create it with production branch feat/deep-living-os. Refusing to deploy into another product."
            exit 1
          fi
      - name: Deploy preview or stable branch (only isolated project)
        if: steps.cf.outputs.connected == 'true' && (github.ref_name != 'feat/deep-living-os' || env.DL_PRODUCTION_ENABLED == 'true')
        working-directory: products/deep-living-os
        run: |
          npx --yes wrangler@4 pages deploy dist --project-name deep-living-os --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA"
      - name: Explicitly state deployment result
        if: always()
        run: |
          echo "Source SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare account configured: ${{ steps.cf.outputs.connected }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Stable branch production enabled: $DL_PRODUCTION_ENABLED" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow does not provision Supabase or verified geospatial sources. Do not claim those features are ready." >> "$GITHUB_STEP_SUMMARY"
